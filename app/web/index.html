<body>
  <noscript>
    <h1>Mettle - AI Mock Interviews for Flutter &amp; Mobile Engineers</h1>
    <p>
      Mettle runs mock technical interviews for Flutter and Dart engineers. An AI
      interviewer asks one question at a time, grounded in situations you would
      actually hit on a team, then scores every answer against a four-dimension
      rubric: correctness, depth, clarity and structure.
    </p>
    <p>
      When an answer comes up thin, the interviewer probes that specific weakness
      instead of moving on. Sessions cover state management, widget lifecycle,
      layout and constraints, navigation, async and isolates, performance
      engineering, platform channels, testing strategy and release management,
      pitched at junior, mid-level or senior difficulty.
    </p>
    <p>This application requires JavaScript to run.</p>
  </noscript>

  <div id="boot">

        <rect x="38" y="13" width="96" height="96" rx="26" fill="url(#bootMark)"/>
        <path d="M74 70L86 56L98 70" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" stroke="#9D8DF1"/>
        <path d="M80 74L86 67L92 74" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" stroke="#E4E1E6"/>
        <defs>
          <linearGradient id="bootMark" x1="38" y1="109" x2="134" y2="13" gradientUnits="userSpaceOnUse">
            <stop stop-color="#9D8DF1" stop-opacity="0.2"/>
            <stop offset="0.5" stop-color="#9D8DF1" stop-opacity="0"/>
            <stop offset="1" stop-color="#2A2A2D" stop-opacity="0.4"/>
          </linearGradient>
        </defs>
      </svg>
      <div class="wordmark">Mettle</div>
      <div class="tagline">AI Mock Interviews for Software Engineers</div>
    </div>
  </div>

  <script>
    window.mettleBootComplete = function () {
      var boot = document.getElementById('boot');
      if (boot) boot.remove();
    };

    window.addEventListener('flutter-first-frame', function () {
      window.setTimeout(window.mettleBootComplete, 8000);
    });
  </script>
