<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description"
        content="AI mock interviews for mobile engineers - rubric-scored practice with progress tracking.">
  <meta name="theme-color" content="#0E0E11">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Mettle">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Mettle</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #0E0E11;
    }
    #boot {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      background: #0E0E11;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      transition: opacity 180ms ease-out;
    }

    #boot[data-leaving="true"] {
      opacity: 0;
    }

    #boot .wordmark {
      font-size: 26px;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: #EDEDF2;
    }

    #boot .bar {
      width: 112px;
      height: 2px;
      border-radius: 999px;
      background: #2E2E38;
      overflow: hidden;
    }

    #boot .bar span {
      display: block;
      width: 40%;
      height: 100%;
      border-radius: 999px;
      background: #9D8DF1;
      animation: slide 1.1s ease-in-out infinite;
    }

    @keyframes slide {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(350%); }
    }

    @media (prefers-reduced-motion: reduce) {
      #boot .bar span { animation: none; width: 100%; }
    }
  </style>
</head>
<body>
  <div id="boot">
    <div class="wordmark">Mettle</div>
    <div class="bar"><span></span></div>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      var boot = document.getElementById('boot');
      if (!boot) return;
      boot.setAttribute('data-leaving', 'true');
      boot.addEventListener('transitionend', function () { boot.remove(); }, { once: true });
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
