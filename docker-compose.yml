services:
  api:
    build:
      context: ./api
    ports:
      - "8000:8000"
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-scripted}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-5}
      DATABASE_URL: sqlite+aiosqlite:////srv/data/mettle.db
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
    volumes:
      - mettle-data:/srv/data

volumes:
  mettle-data:
